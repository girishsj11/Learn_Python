[pytest]
addopts = -ra
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
markers =
    ui: UI tests that use Selenium
    api: API tests that use HTTP requests
    smoke: quick verification of the main login flow
    regression: full regression coverage
    positive: valid credential scenarios
    negative: invalid credential scenarios
    edge: boundary and unusual input scenarios
pythonpath = .
